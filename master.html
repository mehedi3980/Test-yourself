<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduTest Master Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-dot"></span> EduTest</a><div class="top-actions"><span id="who"></span><button id="logout" class="secondary">Logout</button></div></header><main class="admin-shell"><h1>Master Admin</h1><p>Full control over admins, exams and questions.</p><div class="admin-grid"><div class="stat"><span>Admins</span><br><b id="adminCount">0</b></div><div class="stat"><span>All Exams</span><br><b id="examCount">0</b></div><div class="stat"><span>All Questions</span><br><b id="qCount">0</b></div></div><div class="admin-panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Admin Accounts</h2><button id="addAdmin" class="primary">+ Add Admin</button></div><div id="adminList"></div></div><div class="admin-panel"><h2>All Exams</h2><div id="examList"></div></div></main><div id="modal" class="modal-backdrop hidden"><div class="modal"><h2>Create Admin</h2><div class="notice">The password is sent securely to the server function and is never stored in this page or shown to other admins.</div><div class="field"><label>Username</label><input id="u"></div><div class="field"><label>Password</label><input id="p" type="password" minlength="8"></div><button id="create" class="primary">Create Admin</button> <button id="close" class="secondary">Cancel</button><p id="msg"></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const {createClient}=supabase,sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);
async function boot(){const s=await sb.auth.getSession();if(!s.data.session)return location.href="login.html";const u=s.data.session.user,p=await sb.from("profiles").select("*").eq("id",u.id).single();if(p.data?.role!=="master"||!p.data.active)return location.href="admin.html";$("who").textContent=p.data.username;load()}
async function load(){const a=await sb.from("profiles").select("*").order("created_at",{ascending:false});const e=await sb.from("exams").select("*").order("created_at",{ascending:false});const q=await sb.from("questions").select("id",{count:"exact",head:true});$("adminCount").textContent=(a.data||[]).filter(x=>x.role==="admin").length;$("examCount").textContent=(e.data||[]).length;$("qCount").textContent=q.count||0;$("adminList").innerHTML=(a.data||[]).filter(x=>x.role==="admin").map(x=>`<div style="padding:14px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between"><span><b>${x.username}</b><br><small>${x.active?"Active":"Disabled"}</small></span><button class="secondary" onclick="toggle('${x.id}',${!x.active})">${x.active?"Disable":"Enable"}</button></div>`).join("")||"<p>No normal admins yet.</p>";$("examList").innerHTML=(e.data||[]).map(x=>`<div style="padding:12px 0;border-bottom:1px solid #edf0f5"><b>${x.title}</b> — ${x.published?"Published":"Draft"}<br><small>Owner: ${x.owner_id}</small></div>`).join("")||"<p>No exams.</p>"}
window.toggle=async(id,active)=>{const r=await sb.functions.invoke("manage-admin",{body:{action:"set_active",user_id:id,active}});if(r.error)return alert(r.error.message);load()};
$("addAdmin").onclick=()=>{$("modal").classList.remove("hidden");$("u").value="";$("p").value="";$("msg").textContent=""};$("close").onclick=()=>$("modal").classList.add("hidden");
$("create").onclick=async()=>{const username=$("u").value.trim().toLowerCase(),password=$("p").value;if(!/^[a-z0-9_]{3,30}$/.test(username))return $("msg").textContent="Username: 3–30 letters, numbers or underscore.";if(password.length<8)return $("msg").textContent="Password must be at least 8 characters.";const r=await sb.functions.invoke("manage-admin",{body:{action:"create",username,password}});if(r.error){$("msg").textContent=r.error.message;return} $("msg").textContent="Admin created successfully.";setTimeout(()=>{$("modal").classList.add("hidden");load()},700)};
$("logout").onclick=async()=>{await sb.auth.signOut();location.href="login.html"};boot();
</script></body></html>
