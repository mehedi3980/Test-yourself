<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduTest Admin</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-dot"></span> EduTest</a><div class="top-actions"><span id="who"></span><button id="logout" class="secondary">Logout</button></div></header><main class="admin-shell"><h1>Admin Dashboard</h1><p>Manage only the exams and questions owned by your account.</p><div class="admin-grid"><div class="stat"><span>My Exams</span><br><b id="examCount">0</b></div><div class="stat"><span>My Questions</span><br><b id="qCount">0</b></div><div class="stat"><span>Role</span><br><b style="font-size:20px">ADMIN</b></div></div><div class="admin-panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>My Exams</h2><button id="newExam" class="primary">+ New Exam</button></div><div id="examList"></div></div></main><div id="modal" class="modal-backdrop hidden"><div class="modal"><div style="display:flex;justify-content:space-between"><h2 id="modalTitle">New Exam</h2><button id="closeModal" class="secondary">✕</button></div><div class="field"><label>Exam title</label><input id="etitle"></div><div class="field"><label>Duration (minutes)</label><input id="eduration" type="number" min="1" value="20"></div><div class="field"><label>Questions per page</label><select id="eps"><option>10</option><option>15</option><option>20</option></select></div><div class="field"><label>Published</label><select id="epub"><option value="false">No</option><option value="true">Yes</option></select></div><button id="saveExam" class="primary">Save Exam</button><hr><h3>Questions</h3><div id="qEditor"></div><button id="addQ" class="secondary">+ Add Question</button><button id="saveQuestions" class="primary" style="margin-left:8px">Save Questions</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const {createClient}=supabase,sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let user,editing=null, qrows=[];
const $=id=>document.getElementById(id), esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function boot(){const s=await sb.auth.getSession();user=s.data.session?.user;if(!user)return location.href="login.html";const p=await sb.from("profiles").select("*").eq("id",user.id).single();if(p.data?.role!=="admin"||!p.data.active)return location.href="master.html";$("who").textContent=p.data.username;load()}
async function load(){const {data}=await sb.from("exams").select("*").order("created_at",{ascending:false});const own=(data||[]);$("examCount").textContent=own.length;let total=0;for(const e of own){const r=await sb.from("questions").select("id",{count:"exact",head:true}).eq("exam_id",e.id);total+=r.count||0}$("qCount").textContent=total;$("examList").innerHTML=own.map(e=>`<div style="padding:15px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b>${esc(e.title)}</b><br><small>${e.duration_minutes} min • ${e.questions_per_page}/page • <span class="badge">${e.published?"Published":"Draft"}</span></small></div><button class="secondary" onclick="editExam('${e.id}')">Edit</button></div>`).join("")||"<p>No exams yet.</p>"}
window.editExam=async id=>{editing=id;const e=(await sb.from("exams").select("*").eq("id",id).single()).data;Object.assign({},e);$("modalTitle").textContent="Edit Exam";$("etitle").value=e.title;$("eduration").value=e.duration_minutes;$("eps").value=e.questions_per_page;$("epub").value=String(e.published);qrows=(await sb.from("questions").select("*").eq("exam_id",id).order("sort_order")).data||[];renderQ();$("modal").classList.remove("hidden")}
$("newExam").onclick=()=>{editing=null;$("modalTitle").textContent="New Exam";$("etitle").value="";$("eduration").value=20;$("eps").value=10;$("epub").value="false";qrows=[];renderQ();$("modal").classList.remove("hidden")};
$("closeModal").onclick=()=>$("modal").classList.add("hidden");
function renderQ(){$("qEditor").innerHTML=qrows.map((q,i)=>`<div class="admin-panel" style="box-shadow:none;margin:10px 0;padding:15px"><b>Question ${i+1}</b><div class="field"><input data-k="question" data-i="${i}" value="${esc(q.question_text)}" placeholder="Question"></div>${[0,1,2,3].map(j=>`<div class="field"><input data-k="o${j}" data-i="${i}" value="${esc((q.options||[])[j])}" placeholder="Option ${String.fromCharCode(65+j)}"></div>`).join("")}<div class="field"><label>Correct option</label><select data-k="answer" data-i="${i}">${[0,1,2,3].map(j=>`<option value="${j}" ${(q.correct_index||0)===j?"selected":""}>${String.fromCharCode(65+j)}</option>`).join("")}</select></div><button class="secondary" onclick="removeQ(${i})">Remove</button></div>`).join("")}
window.removeQ=i=>{qrows.splice(i,1);renderQ()};$("addQ").onclick=()=>{qrows.push({question_text:"",options:["","","",""],correct_index:0});renderQ()};
$("saveExam").onclick=async()=>{const payload={title:$("etitle").value.trim(),duration_minutes:Number($("eduration").value),questions_per_page:Number($("eps").value),published:$("epub").value==="true",owner_id:user.id};if(!payload.title)return alert("Enter an exam title.");let r;if(editing)r=await sb.from("exams").update(payload).eq("id",editing).select().single();else r=await sb.from("exams").insert(payload).select().single();if(r.error)return alert(r.error.message);editing=r.data.id;await saveQ();alert("Exam saved.");load()};
$("saveQuestions").onclick=saveQ;
async function saveQ(){if(!editing)return alert("Save the exam first.");for(let i=0;i<qrows.length;i++){const el=k=>document.querySelector(`[data-k="${k}"][data-i="${i}"]`);const payload={exam_id:editing,question_text:el("question").value.trim(),options:[0,1,2,3].map(j=>el("o"+j).value.trim()),correct_index:Number(el("answer").value),sort_order:i};let r=qrows[i].id?await sb.from("questions").update(payload).eq("id",qrows[i].id):await sb.from("questions").insert(payload);if(r.error)return alert(r.error.message)}}
$("logout").onclick=async()=>{await sb.auth.signOut();location.href="login.html"};boot();
</script></body></html>
